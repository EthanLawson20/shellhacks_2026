<title id="title">Neural network for possible human scream detection</title><desc id="desc">An audio sample enters a 1D convolution with 16 channels, max pooling by 2, a second 1D convolution with 32 channels, another max pooling by 2, flattening, a dense layer of 64 ReLU units, and one sigmoid output. Connected lines show information passing between layers.</desc>
